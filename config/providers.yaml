providers:
  - id: local-litellm
    type: openai-compatible
    baseURL: http://127.0.0.1:4000/v1
    apiKeyEnv: LITELLM_API_KEY   # can be dummy if your LiteLLM doesn't enforce auth
    models:
      defaultChat: gpt-4o-mini
      coding: claude-3-5-sonnet  # or whichever model alias LiteLLM exposes
      fast: gpt-4o-mini